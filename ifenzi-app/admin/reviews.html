<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reviews | Ifenzi Admin</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="admin-shell">
  <div class="admin-sidebar">
  <div class="logo"><img src="images/logo.png" alt="Ifenzi Beauty Salon logo" style="height:28px;width:auto;display:block"><span>Ifenzi Admin</span></div>
  <a href="index.html">Overview</a>
<a href="services.html">Services</a>
<a href="products.html">Products</a>
  <a href="gallery.html">Gallery</a>
<a href="appointments.html">Appointments</a>
<a href="orders.html">Orders</a>
<a href="messages.html">Messages</a>
<a href="reviews.html" class="active">Reviews</a>
<a href="settings.html">Settings</a>
  <a href="#" class="logout-btn" onclick="logout()">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
    Log out
  </a>
</div>
  <div class="admin-main">
    <div class="admin-topbar">
      <h1 class="font-display">Reviews</h1>
      <span style="font-size:.82rem;color:var(--ink-soft)">Logged in as <b id="adminUsername">&hellip;</b></span>
    </div>
    
<div style="display:flex;justify-content:flex-end;margin-bottom:16px"><button class="btn btn-primary" onclick="newReview()">+ Add Review</button></div>
<div class="table-wrap">
  <table class="admin-table">
    <thead><tr><th>Name</th><th>Rating</th><th>Review</th><th>Status</th><th>Actions</th></tr></thead>
    <tbody id="reviewsBody"><tr><td colspan="5">Loading&hellip;</td></tr></tbody>
  </table>
</div>

  </div>
</div>
<div class="modal-overlay" id="reviewModal"><div class="modal-box">
  <div class="modal-head"><span class="font-display" style="font-size:1.2rem" id="reviewModalTitle">Add Review</span><button class="btn-icon" onclick="closeModal('reviewModal')">&times;</button></div>
  <form class="stacked" onsubmit="return saveReview(event)">
    <input type="hidden" id="reviewId">
    <input required class="field" id="reviewName" placeholder="Customer name">
    <select required class="field" id="reviewRating"><option value="5">5 stars</option><option value="4">4 stars</option><option value="3">3 stars</option><option value="2">2 stars</option><option value="1">1 star</option></select>
    <textarea required class="field" id="reviewText" rows="4" placeholder="What the customer said"></textarea>
    <label style="display:flex;align-items:center;gap:8px;font-size:.88rem"><input type="checkbox" id="reviewApproved" checked> Show on the website</label>
    <button type="submit" class="btn btn-primary" style="justify-content:center">Save Review</button>
  </form></div></div>
<script src="js/main.js"></script>
<script>requireAuth();loadReviews();</script>
</body>
</html>
