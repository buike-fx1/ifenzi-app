<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in | Ifenzi Admin</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="admin-login-wrap">
  <div class="card admin-login-card">
    <div class="logo" style="justify-content:center;margin-bottom:20px"><img src="images/logo.png" alt="Ifenzi Beauty Salon logo" style="height:28px;width:auto;display:block"><span class="font-display" style="font-size:1.3rem">Ifenzi Admin</span></div>
    <form class="stacked" onsubmit="return handleLogin(event)">
      <input required class="field" id="loginUser" placeholder="Username" autocomplete="username">
      <input required type="password" class="field" id="loginPass" placeholder="Password" autocomplete="current-password">
      <div class="error-text" id="loginError" style="display:none"></div>
      <button type="submit" class="btn btn-primary" style="justify-content:center">Log In</button>
    </form>
  </div>
</div>
<script src="js/main.js"></script>
</body>
</html>
