<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings | Ifenzi Admin</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="admin-shell">
  <div class="admin-sidebar">
  <div class="logo"><img src="images/logo.png" alt="Ifenzi Beauty Salon logo" style="height:28px;width:auto;display:block"><span>Ifenzi Admin</span></div>
  <a href="index.html">Overview</a>
<a href="services.html">Services</a>
<a href="products.html">Products</a>
  <a href="gallery.html">Gallery</a>
<a href="appointments.html">Appointments</a>
<a href="orders.html">Orders</a>
<a href="messages.html">Messages</a>
<a href="reviews.html">Reviews</a>
<a href="settings.html" class="active">Settings</a>
  <a href="#" class="logout-btn" onclick="logout()">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
    Log out
  </a>
</div>
  <div class="admin-main">
    <div class="admin-topbar">
      <h1 class="font-display">Settings</h1>
      <span style="font-size:.82rem;color:var(--ink-soft)">Logged in as <b id="adminUsername">&hellip;</b></span>
    </div>
    
<div class="grid grid-2">
  <div class="card">
    <div style="font-weight:600;margin-bottom:16px">Business Information</div>
    <form class="stacked" onsubmit="return saveSettings(event)">
      <label style="font-size:.78rem;color:var(--ink-soft)">Business name</label>
      <input class="field" id="set_business_name">
      <label style="font-size:.78rem;color:var(--ink-soft)">Address</label>
      <input class="field" id="set_address">
      <label style="font-size:.78rem;color:var(--ink-soft)">Phone</label>
      <input class="field" id="set_phone">
      <label style="font-size:.78rem;color:var(--ink-soft)">Instagram handle</label>
      <input class="field" id="set_instagram">
      <label style="font-size:.78rem;color:var(--ink-soft)">Facebook page name</label>
      <input class="field" id="set_facebook">
      <label style="font-size:.78rem;color:var(--ink-soft)">Opening hours (Mon–Sat)</label>
      <input class="field" id="set_hours_weekday">
      <label style="font-size:.78rem;color:var(--ink-soft)">Opening hours (Sunday)</label>
      <input class="field" id="set_hours_sunday">
      <label style="font-size:.78rem;color:var(--ink-soft)">Map search text (used for the map and directions)</label>
      <input class="field" id="set_map_query">
      <label style="font-size:.78rem;color:var(--ink-soft)">Google Maps place link</label>
      <input class="field" id="set_map_link">
      <button type="submit" class="btn btn-primary" style="justify-content:center">Save Settings</button>
    </form>
  </div>

  <div class="card">
    <div style="font-weight:600;margin-bottom:16px">Change Admin Password</div>
    <form class="stacked" id="passwordForm" onsubmit="return changePassword(event)">
      <input required type="password" class="field" id="curPass" placeholder="Current password">
      <input required type="password" class="field" id="newPass" placeholder="New password (min 6 characters)">
      <div id="passMsg" style="font-size:.82rem"></div>
      <button type="submit" class="btn btn-outline" style="justify-content:center">Update Password</button>
    </form>
  </div>
</div>

  </div>
</div>
<script src="js/main.js"></script>
<script>requireAuth();loadSettings();</script>
</body>
</html>
