<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products | Ifenzi Admin</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="admin-shell">
  <div class="admin-sidebar">
  <div class="logo"><img src="images/logo.png" alt="Ifenzi Beauty Salon logo" style="height:28px;width:auto;display:block"><span>Ifenzi Admin</span></div>
  <a href="index.html">Overview</a>
<a href="services.html">Services</a>
<a href="products.html" class="active">Products</a>
  <a href="gallery.html">Gallery</a>
<a href="appointments.html">Appointments</a>
<a href="orders.html">Orders</a>
<a href="messages.html">Messages</a>
<a href="reviews.html">Reviews</a>
<a href="settings.html">Settings</a>
  <a href="#" class="logout-btn" onclick="logout()">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
    Log out
  </a>
</div>
  <div class="admin-main">
    <div class="admin-topbar">
      <h1 class="font-display">Products</h1>
      <span style="font-size:.82rem;color:var(--ink-soft)">Logged in as <b id="adminUsername">&hellip;</b></span>
    </div>
    
<div style="display:flex;justify-content:flex-end;margin-bottom:16px">
  <button class="btn btn-primary" onclick="newProduct()">+ Add Product</button>
</div>
<div class="table-wrap">
  <table class="admin-table">
    <thead><tr><th></th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Status</th><th>Actions</th></tr></thead>
    <tbody id="productsBody"><tr><td colspan="7">Loading&hellip;</td></tr></tbody>
  </table>
</div>

<div class="modal-overlay" id="productModal">
  <div class="modal-box">
    <div class="modal-head"><span class="font-display" style="font-size:1.2rem" id="productModalTitle">Add Product</span>
      <button class="btn-icon" onclick="closeModal('productModal')">&times;</button>
    </div>
    <form class="stacked" onsubmit="return saveProduct(event)">
      <input type="hidden" id="productId">
      <input required class="field" id="productName" placeholder="Product name">
      <input required class="field" id="productCategory" list="catList" placeholder="Category (pick one or type a new one)">
      <datalist id="catList"></datalist>
      <input required type="number" class="field" id="productPrice" placeholder="Price (Naira)">
      <input required type="number" class="field" id="productStock" placeholder="Stock quantity">
      <input class="field" id="productImage" placeholder="Image link — paste a photo address">
      <div class="hint">Right-click a photo online, choose “Copy image address”, and paste it here.</div>
      <textarea class="field" id="productDescription" rows="3" placeholder="Short description"></textarea>
      <label style="display:flex;align-items:center;gap:8px;font-size:.88rem"><input type="checkbox" id="productActive"> Active (visible on the website)</label>
      <button type="submit" class="btn btn-primary" style="justify-content:center">Save Product</button>
    </form>
  </div>
</div>

  </div>
</div>
<script src="js/main.js"></script>
<script>requireAuth();loadProducts();</script>
</body>
</html>
