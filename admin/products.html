<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products | Ifenzi Admin</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="admin-shell">
  <div class="admin-sidebar">
  <div class="logo"><svg width="28" height="28" viewBox="0 0 100 100" fill="none">
  <path d="M50 8c14 0 22 10 22 22 0 3-1 7-2 10 6 4 9 10 8 18-1 9-8 14-8 22 0 6 3 9 7 11-6 4-14 3-18-2-2 8-9 13-9 20"
    stroke="var(--gold)" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  <path d="M32 34c-2 8 0 15 5 20-6 3-9 9-8 16 1 6 6 10 6 16 0 4-2 6-5 8"
    stroke="var(--gold)" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  <path d="M38 40c2-3 6-5 10-4M60 40c2-3 6-4 9-2" stroke="var(--gold)" stroke-width="2" stroke-linecap="round"/>
  <path d="M40 58c4 4 12 4 16 0" stroke="var(--gold)" stroke-width="2" stroke-linecap="round" fill="none"/>
</svg><span>Ifenzi Admin</span></div>
  <a href="index.html">Overview</a>
<a href="services.html">Services</a>
<a href="products.html" class="active">Products</a>
<a href="appointments.html">Appointments</a>
<a href="orders.html">Orders</a>
<a href="messages.html">Messages</a>
<a href="reviews.html">Reviews</a>
<a href="settings.html">Settings</a>
  <a href="#" class="logout-btn" onclick="logout()">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
    Log out
  </a>
</div>
  <div class="admin-main">
    <div class="admin-topbar">
      <h1 class="font-display">Products</h1>
      <span style="font-size:.82rem;color:var(--ink-soft)">Logged in as <b id="adminUsername">&hellip;</b></span>
    </div>
    
<div style="display:flex;justify-content:flex-end;margin-bottom:16px">
  <button class="btn btn-primary" onclick="newProduct()">+ Add Product</button>
</div>
<div class="table-wrap">
  <table class="admin-table">
    <thead><tr><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Status</th><th>Actions</th></tr></thead>
    <tbody id="productsBody"><tr><td colspan="6">Loading&hellip;</td></tr></tbody>
  </table>
</div>

<div class="modal-overlay" id="productModal">
  <div class="modal-box">
    <div class="modal-head"><span class="font-display" style="font-size:1.2rem" id="productModalTitle">Add Product</span>
      <button class="btn-icon" onclick="closeModal('productModal')">&times;</button>
    </div>
    <form class="stacked" onsubmit="return saveProduct(event)">
      <input type="hidden" id="productId">
      <input required class="field" id="productName" placeholder="Product name">
      <input required class="field" id="productCategory" placeholder="Category (e.g. Hair Care, Wigs, Makeup)">
      <input required type="number" class="field" id="productPrice" placeholder="Price (Naira)">
      <input required type="number" class="field" id="productStock" placeholder="Stock quantity">
      <label style="display:flex;align-items:center;gap:8px;font-size:.88rem"><input type="checkbox" id="productActive"> Active (visible on the website)</label>
      <button type="submit" class="btn btn-primary" style="justify-content:center">Save Product</button>
    </form>
  </div>
</div>

  </div>
</div>
<script src="js/main.js"></script>
<script>requireAuth();loadProducts();</script>
</body>
</html>
