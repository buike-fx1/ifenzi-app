<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in | Ifenzi Admin</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="admin-login-wrap">
  <div class="card admin-login-card">
    <div class="logo" style="justify-content:center;margin-bottom:20px"><svg width="28" height="28" viewBox="0 0 100 100" fill="none">
  <path d="M50 8c14 0 22 10 22 22 0 3-1 7-2 10 6 4 9 10 8 18-1 9-8 14-8 22 0 6 3 9 7 11-6 4-14 3-18-2-2 8-9 13-9 20"
    stroke="var(--gold)" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  <path d="M32 34c-2 8 0 15 5 20-6 3-9 9-8 16 1 6 6 10 6 16 0 4-2 6-5 8"
    stroke="var(--gold)" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  <path d="M38 40c2-3 6-5 10-4M60 40c2-3 6-4 9-2" stroke="var(--gold)" stroke-width="2" stroke-linecap="round"/>
  <path d="M40 58c4 4 12 4 16 0" stroke="var(--gold)" stroke-width="2" stroke-linecap="round" fill="none"/>
</svg><span class="font-display" style="font-size:1.3rem">Ifenzi Admin</span></div>
    <form class="stacked" onsubmit="return handleLogin(event)">
      <input required class="field" id="loginUser" placeholder="Username" autocomplete="username">
      <input required type="password" class="field" id="loginPass" placeholder="Password" autocomplete="current-password">
      <div class="error-text" id="loginError" style="display:none"></div>
      <button type="submit" class="btn btn-primary" style="justify-content:center">Log In</button>
    </form>
    <p style="font-size:.75rem;color:var(--ink-soft);margin-top:16px;text-align:center">
      First run? Default login is printed in your terminal the first time you start the server.
    </p>
  </div>
</div>
<script src="js/main.js"></script>
</body>
</html>
